<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head><body>
<iframe id="f" src="/index.html" style="width:430px;height:900px"></iframe>
<pre id="out"></pre>
<script>
const log = [];
const A = (name, cond) => log.push((cond ? 'PASS' : 'FAIL') + ' ' + name);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');

/* Cinemeta, faked: the app's fetch answers from this table and logs every ask, so the test
   never leaves the machine and can prove who asks (only the lister, only in Watch, only
   finished titles). Any other search finds nothing. */
const CANNED = {
  'catalog/movie/top/search=Inception.json': { metas: [{ id: 'tt1375666', imdb_id: 'tt1375666', name: 'Inception', releaseInfo: '2010' }] },
  'meta/movie/tt1375666.json': { meta: { imdb_id: 'tt1375666', name: 'Inception', imdbRating: '8.8', runtime: '148 min', genre: ['Adventure', 'Sci-Fi', 'Thriller'], popularity: 1.8, releaseInfo: '2010' } },
  'catalog/movie/top/search=Fargo.json': { metas: [{ id: 'tt0116282', imdb_id: 'tt0116282', name: 'Fargo', releaseInfo: '1996' }] },
  'catalog/series/top/search=Fargo.json': { metas: [{ id: 'tt2802850', imdb_id: 'tt2802850', name: 'Fargo', releaseInfo: '2014-2024' }] },
  'meta/movie/tt0116282.json': { meta: { imdb_id: 'tt0116282', name: 'Fargo', imdbRating: '8.1', runtime: '98 min', genre: ['Crime', 'Drama', 'Thriller'], popularity: 0.42, releaseInfo: '1996' } },
  'meta/series/tt2802850.json': { meta: { imdb_id: 'tt2802850', name: 'Fargo', imdbRating: '8.8', runtime: '52 min', genre: ['Crime', 'Drama', 'Thriller'], popularity: 3.2, releaseInfo: '2014–2024', videos: [1, 1, 2, 3, 4, 5, 0].map((season) => ({ season })) } },
  'catalog/movie/top/search=Past%20Lives.json': { metas: [{ id: 'tt13238346', imdb_id: 'tt13238346', name: 'Past Lives', releaseInfo: '2023' }] },
  'meta/movie/tt13238346.json': { meta: { imdb_id: 'tt13238346', name: 'Past Lives', imdbRating: '7.8', runtime: '105 min', genre: ['Drama', 'Romance'], popularity: 1.1, releaseInfo: '2023' } },
  'catalog/series/top/search=Severance.json': { metas: [{ id: 'tt11280740', imdb_id: 'tt11280740', name: 'Severance', releaseInfo: '2022-' }] },
  'meta/series/tt11280740.json': { meta: { imdb_id: 'tt11280740', name: 'Severance', imdbRating: '8.7', runtime: '55 min', genre: ['Drama', 'Mystery', 'Sci-Fi'], popularity: 2.5, releaseInfo: '2022–', videos: [1, 2].map((season) => ({ season })) } },
  'catalog/series/top/search=The%20Bear.json': { metas: [{ id: 'tt14452776', imdb_id: 'tt14452776', name: 'The Bear', releaseInfo: '2022-' }] },
  'meta/series/tt14452776.json': { meta: { imdb_id: 'tt14452776', name: 'The Bear', imdbRating: '8.5', runtime: '34 min', genre: ['Comedy', 'Drama'], popularity: 2.2, releaseInfo: '2022–', videos: [1, 2, 3, 4].map((season) => ({ season })) } },
};
function fakeCinemeta(w) {
  const calls = [];
  w.fetch = async (url) => {
    const path = String(url).replace('https://v3-cinemeta.strem.io/', '');
    calls.push(path);
    const body = CANNED[path] || (path.startsWith('catalog/') ? { metas: [] } : null);
    return body ? new w.Response(JSON.stringify(body), { status: 200 }) : new w.Response('none', { status: 404 });
  };
  return calls;
}

async function run() {
  await new Promise((r) => { f.onload = r; });
  await sleep(300);
  let d = f.contentDocument;
  A('home renders brand', !!d.querySelector('.brand'));
  A('home has 5 option inputs', d.querySelectorAll('.opt-in').length === 5);
  A('compose wears the blue step band (5)', d.querySelector('#app').dataset.stage === '5' && !!d.querySelector('.band .giant'));
  A('note starts folded into its ✎ row', d.querySelector('#note-in').closest('.cell').hidden === true);
  d.querySelector('[data-action="add-note"][data-for="note-in"]').click();
  A('✎ unfolds the note', d.querySelector('#note-in').closest('.cell').hidden === false);

  // --- paste a numbered list into option 1 ---
  const W = f.contentWindow;
  const dt = new W.DataTransfer();
  dt.setData('text/plain', '1 tacos\n2 burger place\n3. mcdonalds\n4 eat at home\n5 oyster bar');
  const pe = new W.ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true });
  d.querySelector('#opt0').dispatchEvent(pe);
  await sleep(200);
  A('paste fills the five', d.querySelector('#opt0').value === 'tacos' && d.querySelector('#opt4').value === 'oyster bar');

  // --- a half-typed five survives a reload ---
  const reloaded = new Promise((r) => { f.onload = r; });
  f.contentWindow.location.reload();
  await reloaded;
  await sleep(300);
  d = f.contentDocument;
  const foodCalls = fakeCinemeta(f.contentWindow); // lives until the next full load: the whole food round below
  A('draft survives reload', d.querySelector('#opt0').value === 'tacos' && d.querySelector('#opt4').value === 'oyster bar');

  // --- compose ---
  d.querySelector('#title-in').value = 'Dinner Friday';
  d.querySelector('#name-in').value = 'Sam';
  d.querySelector('#note-in').value = 'surprise me, somewhere warm';
  const opts = ['Sushi bar', 'Thai place', 'Pasta place', 'Burger joint', 'Noodle bar'];
  opts.forEach((o, i) => { d.querySelector('#opt' + i).value = o; });

  // --- emoji picker: explicit pick on option 4, option 5 becomes emoji-only ---
  d.querySelectorAll('.emoji-btn')[2].click();
  await sleep(100);
  A('emoji palette opens', !!d.querySelector('.emoji-palette'));
  A('palette autofocuses its search box', d.activeElement === d.querySelector('#pal-search'));
  d.querySelector('#title-in').click(); // gave up — tap elsewhere
  await sleep(100);
  A('palette closes on outside tap', !d.querySelector('.emoji-palette'));
  d.querySelectorAll('.emoji-btn')[3].click();
  await sleep(100);
  d.querySelector('.pal-cell[data-e="🌮"]').click();
  await sleep(100);
  A('palette closes on pick', !d.querySelector('.emoji-palette'));
  A('picked emoji shows on its button', d.querySelectorAll('.emoji-btn')[3].textContent === '🌮');
  d.querySelectorAll('.emoji-btn')[4].click();
  await sleep(100);
  d.querySelector('.pal-cell[data-e="🦪"]').click();
  await sleep(100);
  d.querySelector('#opt4').value = ''; // just the emoji — still a valid option
  d.querySelector('[data-action="compose-share"]').click();
  await sleep(400);
  const cutUrl = d.querySelector('#compose-linkrow #share-url')?.dataset.url || '';
  A('compose generates cut link', cutUrl.includes('#'));
  A('share sheet is gone', !d.querySelector('[data-action="share-alt"]'));
  A('send-in-messages offered', d.querySelector('[data-action="send-msg"]')?.hidden === false);
  A('send link prebuilt for a one-tap Messages hand-off', (await f.contentWindow.prepare()).msg === cutUrl);
  log.push('CUTURL ' + cutUrl);

  // --- cut (hash change, same document) ---
  f.contentWindow.location.href = cutUrl;
  await sleep(400);
  d = f.contentDocument;
  A('cut renders 5 choices', d.querySelectorAll('.choices .choice').length === 5);
  A('cut has 5 map pins', d.querySelectorAll('.choices .mapbtn').length === 5);
  A('map view deferred (no panel)', !d.querySelector('#geo-panel'));
  A('cut names the lister', d.body.textContent.includes('Sam sent five'));
  A('cut wears the yellow step band (2)', d.querySelector('#app').dataset.stage === '2');
  A('cut shows the lister note', !!d.querySelector('.round-note') && d.querySelector('.round-note').textContent.includes('surprise me, somewhere warm'));
  A('cut emoji matched sushi', d.body.textContent.includes('🍣'));
  const pickedRow = [...d.querySelectorAll('.choices .choice')].find((c) => c.querySelector('.emoji').textContent === '🌮');
  A('picked emoji overrides auto, label stays clean', !!pickedRow && pickedRow.querySelector('.label').textContent === 'Burger joint');
  A('emoji-only option is a full choice', [...d.querySelectorAll('.choices .choice')].some((c) => c.querySelector('.emoji').textContent === '🦪'));
  A('map buttons use external-link icon', d.querySelectorAll('.choices .mapbtn svg').length === 5);
  A('cut cta starts disabled', d.querySelector('#cta').disabled === true);
  const cards = d.querySelectorAll('.choices .choice');
  cards[0].click(); cards[1].click();
  await sleep(150);
  cards[2].click(); // third keep must be refused
  await sleep(150);
  A('third keep refused', d.querySelectorAll('.choice.kept').length === 2);
  A('cta enabled at exactly 2', d.querySelector('#cta').disabled === false);
  A('non-kept rows gray out', d.querySelectorAll('.choices .dimmed-row').length === 3);
  d.querySelector('#cutter-name').value = 'Partner';
  d.querySelector('#cut-note').value = 'number 3 was also fine';
  d.querySelector('[data-action="cut-share"]').click();
  await sleep(400);
  const closeUrl = d.querySelector('#cut-linkrow #share-url')?.dataset.url || '';
  A('cut generates close link', closeUrl.includes('#'));
  log.push('CLOSEURL ' + closeUrl);

  // --- close ---
  f.contentWindow.location.href = closeUrl;
  await sleep(400);
  d = f.contentDocument;
  A('close renders exactly 2', d.querySelectorAll('#final-choices .choice').length === 2);
  A('close names the cutter', d.body.textContent.includes('Partner kept two'));
  A('close wears the red step band (1)', d.querySelector('#app').dataset.stage === '1');
  A('close send waits for a pick', d.querySelector('#cta').disabled === true);
  A('close shows the note passed back', !!d.querySelector('.round-note') && d.querySelector('.round-note').textContent.includes('number 3 was also fine'));
  A('cut three ghosted below, same style', d.querySelectorAll('#ghost-rows .ghost-row').length === 3 &&
    d.body.textContent.includes('Pasta place'));
  d.querySelectorAll('#final-choices .choice')[0].click();
  await sleep(500);
  A('verdict note appears after a pick', !!d.querySelector('#close-after #close-note'));
  A('send enabled once picked', d.querySelector('#cta').disabled === false);
  d.querySelectorAll('#final-choices .choice')[1].click(); // changed my mind…
  await sleep(150);
  const rows = d.querySelectorAll('#final-choices .choice-row');
  A('re-pick moves the winner', rows[1].classList.contains('picked') && !rows[0].classList.contains('picked'));
  d.querySelectorAll('#final-choices .choice')[0].click(); // …and back
  await sleep(150);
  d.querySelector('#close-note').value = 'it was close';
  const verdict = (await f.contentWindow.prepare()).msg;
  A('verdict message leads with the winner', verdict.startsWith('🏆 Sushi bar! ') && verdict.includes('#2'));
  d.querySelector('[data-action="close-share"]').click();
  await sleep(400);
  const doneUrl = d.querySelector('#close-linkrow #share-url')?.dataset.url || '';
  A('close generates done link', doneUrl.includes('#'));
  log.push('DONEURL ' + doneUrl);

  // --- done ---
  f.contentWindow.location.href = doneUrl;
  await sleep(600);
  d = f.contentDocument;
  A('done shows trophy', !!d.querySelector('.trophy'));
  A('done shows winner', d.body.textContent.includes('Sushi bar'));
  A('done shows the verdict note', !!d.querySelector('.round-note') && d.querySelector('.round-note').textContent.includes('it was close'));
  A('done credits the ritual', d.body.textContent.includes('Partner kept Sushi bar'));
  A('done keeps Open in Maps for food', !!d.querySelector('.band .chip.maps[data-action="show-map"]'));
  A('a food round asks no outside service, start to trophy', foodCalls.length === 0);

  // --- history + broken link ---
  f.contentWindow.location.href = '/index.html#not-a-real-payload';
  await sleep(400);
  d = f.contentDocument;
  A('broken link handled kindly', d.body.textContent.includes("didn't survive"));

  // --- codec: new links are compressed (v2), old v1 links still decode ---
  A('new links are compressed (v2 hash)', [cutUrl, closeUrl, doneUrl].every((u) => u.split('#')[1]?.[0] === '2'));
  log.push(`LEN cut=${cutUrl.length} close=${closeUrl.length} done=${doneUrl.length}`);
  const legacyJson = JSON.stringify({ v: 1, s: 'cut', t: 'Old thread', l: 'Sam', o: ['🍕 Slice shop', 'Thai place', 'Falafel stand'] });
  const legacyHash = btoa(unescape(encodeURIComponent(legacyJson))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  f.contentWindow.location.href = '/index.html#' + legacyHash;
  await sleep(400);
  d = f.contentDocument;
  A('legacy v1 link still decodes', d.querySelectorAll('.choices .choice').length === 3 && d.body.textContent.includes('Slice shop'));

  // --- draft deep link (voice prefill): seeds compose, strips hash ---
  const W2 = f.contentWindow;
  const draftHash = await W2.encodePayload({ v: 1, s: 'draft', t: 'Thursday dinner', o: ['Happy hour spot', 'Wine bar', 'Trattoria'], n: 'from voice' });
  W2.location.href = '/index.html#' + draftHash;
  await sleep(400);
  d = f.contentDocument;
  A('draft link opens compose', d.querySelectorAll('.opt-in').length >= 5);
  A('draft link strips its hash', f.contentWindow.location.hash === '');
  A('draft seeds title', d.querySelector('#title-in')?.value === 'Thursday dinner');
  A('draft seeds options', d.querySelector('#opt0')?.value === 'Happy hour spot' && d.querySelector('#opt2')?.value === 'Trattoria');
  A('draft seeds note', d.querySelector('#note-in')?.value === 'from voice');
  A('draft leaves empty slots empty', (d.querySelector('#opt3')?.value ?? '') === '');

  f.contentWindow.location.href = '/index.html';
  await sleep(400);
  d = f.contentDocument;
  A('no recent-rounds list on home', !d.body.textContent.includes('Recent rounds'));
  A('rounds still logged on this phone (first-timer checks)', JSON.parse(f.contentWindow.localStorage.getItem('521.history') || '[]').some((h) => h.winner === 'Sushi bar'));
  A('draft survives into a fresh load', d.querySelector('#opt1')?.value === 'Wine bar');

  // ============ modes: the title picks one, the pill overrides it ============
  let Wm = f.contentWindow;
  Wm.localStorage.removeItem('521.draft');
  Wm.localStorage.removeItem('521.watchCache');
  const fresh = new Promise((r) => { f.onload = r; });
  Wm.location.reload();
  await fresh;
  await sleep(300);
  d = f.contentDocument;
  Wm = f.contentWindow;
  const calls = fakeCinemeta(Wm);
  const type = (sel, value) => { const el = d.querySelector(sel); el.value = value; el.dispatchEvent(new Wm.Event('input', { bubbles: true })); };
  const leave = (sel) => d.querySelector(sel).dispatchEvent(new Wm.Event('change', { bubbles: true }));
  const pill = () => d.querySelector('#mode-pill')?.textContent || '';
  const facts = (i) => d.querySelector('#ofacts' + i)?.textContent || '';
  const tile = (i) => d.querySelectorAll('.emoji-btn')[i]?.textContent;
  A('a new round starts as Food', pill().includes('Food'));
  type('#title-in', 'Movie night');
  await sleep(100);
  A('the title picks Watch', pill().includes('Watch'));
  A('Watch swaps the food placeholders', d.querySelector('#opt0').placeholder === 'the buzzy one');

  // --- Watch: lookups wait for a finished title, and only the lister's phone asks ---
  type('#opt0', 'Incep');
  await sleep(300);
  A('a half-typed title is not looked up', calls.length === 0);
  type('#opt0', 'Inception');
  await sleep(1500); // the typing pause passes
  A('a finished title is looked up', calls.some((c) => c.includes('search=Inception.json')));
  A('nothing half-typed ever went out', !calls.some((c) => c.includes('Incep.json')));
  A('compose shows the score over the year and length', facts(0).includes('★ 8.8') && facts(0).includes('2010 · 2h 28m'));
  A('the genre picks the emoji (sci-fi 🚀)', tile(0) === '🚀');
  type('#opt1', 'Fargo'); leave('#opt1');
  type('#opt2', 'Past Lives'); leave('#opt2');
  type('#opt3', 'Severance'); leave('#opt3');
  type('#opt4', 'zzqx not a film'); leave('#opt4');
  await sleep(600);
  A('leaving a row looks it up at once', facts(2).includes('★ 7.8'));
  A('movie night finds Fargo the film', facts(1).includes('1996 · 1h 38m'));
  type('#title-in', 'Next show');
  await sleep(1500);
  A('a show title asks again: Fargo the series', facts(1).includes('2014 · 5 seasons') && tile(1) === '🕵️');
  A('no match shows no score', !d.querySelector('#ofacts4 .facts'));
  d.querySelector('#name-in').value = 'Sam';
  d.querySelector('[data-action="compose-share"]').click();
  await sleep(400);
  const watchCut = d.querySelector('#compose-linkrow #share-url')?.dataset.url || '';
  const wp = await Wm.decodePayload(watchCut.split('#')[1]);
  A('the mode rides in the link', wp.m === 'w');
  A('the facts ride in the link, one per option', JSON.stringify(wp.x) ===
    JSON.stringify([[1375666, 88, 148], [2802850, 88, 52, 5], [13238346, 78, 105], [11280740, 87, 55, 2], 0]));
  A('the years ride beside them (a show: its first year)', JSON.stringify(wp.y) === JSON.stringify([2010, 2014, 2023, 2022, 0]));
  A('genre emoji ride in the option text', wp.o[0] === '🚀 Inception' && wp.o[1] === '🕵️ Fargo' && wp.o[4] === 'zzqx not a film');

  calls.length = 0;
  Wm.location.href = watchCut;
  await sleep(400);
  d = f.contentDocument;
  const rowFacts = [...d.querySelectorAll('.choices .facts')];
  A('watch cut: no Maps buttons', d.querySelectorAll('.choices .mapbtn').length === 0);
  A('watch cut: every found title shows its facts', rowFacts.length === 4);
  A('the score links to the IMDb title page', rowFacts[0]?.getAttribute('href') === 'https://www.imdb.com/title/tt1375666/');
  A('a film shows its year and runtime', rowFacts[0]?.textContent.includes('★ 8.8') && rowFacts[0]?.textContent.includes('2010 · 2h 28m'));
  A('a show shows its first year and seasons', rowFacts[1]?.textContent.includes('2014 · 5 seasons'));
  A('an unfound title gets an IMDb search ↗', d.querySelector('.choices .imdbbtn')?.getAttribute('href') === 'https://www.imdb.com/find/?q=zzqx%20not%20a%20film');
  A('the receiving phone shows the genre emoji', [...d.querySelectorAll('.choices .emoji')].slice(0, 4).map((e) => e.textContent).join('') === '🚀🕵️💕🚀');
  A('the title pill shows what you watch', (d.querySelector('.band .pill')?.textContent || '').startsWith('📺'));
  A('the strike-out ✕ stays', d.querySelectorAll('.choices .strikebtn').length === 5);
  const wc = d.querySelectorAll('.choices .choice');
  wc[0].click(); wc[1].click();
  await sleep(150);
  d.querySelector('[data-action="cut-share"]').click();
  await sleep(400);
  const watchClose = d.querySelector('#cut-linkrow #share-url')?.dataset.url || '';
  Wm.location.href = watchClose;
  await sleep(400);
  d = f.contentDocument;
  A('watch close: both finalists keep their facts', d.querySelectorAll('#final-choices .facts').length === 2);
  d.querySelectorAll('#final-choices .choice')[1].click();
  await sleep(300);
  d.querySelector('[data-action="close-share"]').click();
  await sleep(400);
  const watchDone = d.querySelector('#close-linkrow #share-url')?.dataset.url || '';
  Wm.location.href = watchDone;
  await sleep(600);
  d = f.contentDocument;
  const winChip = d.querySelector('.band a.chip');
  A('the watch winner links to IMDb with its facts', winChip?.getAttribute('href') === 'https://www.imdb.com/title/tt2802850/' &&
    winChip.textContent.includes('★ 8.8 · 2014 · 5 seasons'));
  A('after compose, the round asked no one', calls.length === 0);
  const cutAt = async (payload) => {
    Wm.location.href = watchCut.split('#')[0] + '#' + await Wm.encodePayload(payload);
    await sleep(400);
    d = f.contentDocument;
    return [...d.querySelectorAll('.choices .facts')].map((e) => e.textContent).join(' | ');
  };
  const legacy = { ...wp };
  delete legacy.y;
  const legacyFacts = await cutAt(legacy);
  A('a link from before the year still shows score and length', legacyFacts.includes('★ 8.8') && legacyFacts.includes('2h 28m') && !legacyFacts.includes('2010'));
  const junkFacts = await cutAt({ ...wp, y: ['2010', 99999, -1, 1999] });
  A('only real years show', !junkFacts.includes('2010') && !junkFacts.includes('99999') && junkFacts.includes('1999 · 2 seasons'));
  log.push(`LEN watch cut=${watchCut.length} close=${watchClose.length} done=${watchDone.length}`);

  // --- back on compose: one fresh round per mode ---
  const freshCompose = async () => {
    Wm.localStorage.removeItem('521.draft');
    Wm.eval('composeCount = 5; optEmoji = {};');
    if (Wm.location.hash) Wm.location.hash = ''; else Wm.route(); // re-render compose either way
    await sleep(300);
    d = f.contentDocument;
  };
  const sendFive = async (title, five) => {
    type('#title-in', title);
    five.forEach((o, i) => type('#opt' + i, o));
    await sleep(100);
    d.querySelector('[data-action="compose-share"]').click();
    await sleep(400);
    return d.querySelector('#compose-linkrow #share-url')?.dataset.url || '';
  };
  calls.length = 0;

  // Food: your past emoji pick returns for that name, and leaves with its text
  await freshCompose();
  A('a fresh round is Food again', pill().includes('Food'));
  type('#opt0', 'Burger joint');
  A('your past pick returns for that name', tile(0) === '🌮');
  type('#opt0', '');
  A('clearing the row clears its emoji too', tile(0) === '＋');
  const foodCut = await sendFive('Friday', ['', 'Sushi bar', 'Thai place', 'Pasta place', 'Noodle bar']);
  const fp = await Wm.decodePayload(foodCut.split('#')[1]);
  A('no lone emoji left behind as an option', fp.o.length === 4 && !fp.o.includes('🌮'));
  A('a food link carries no mode and no facts', !('m' in fp) && !('x' in fp));

  // Travel: the title picks it; places get flags and keep Maps
  await freshCompose();
  const tripCut = await sendFive('Weekend trip', ['Lisbon', 'Kyoto', 'Napa', 'Montréal', 'A cabin']);
  A('a trip title is Travel', (await Wm.decodePayload(tripCut.split('#')[1])).m === 't');
  Wm.location.href = tripCut;
  await sleep(400);
  d = f.contentDocument;
  A('travel finds flags and places', [...d.querySelectorAll('.choices .emoji')].map((e) => e.textContent).join('') === '🇵🇹🇯🇵🍷🇨🇦🌲');
  A('travel keeps the Maps buttons', d.querySelectorAll('.choices .mapbtn').length === 5);

  // Other, from the pill: no ↗ at all, and the title stops steering
  await freshCompose();
  type('#title-in', 'Friday');
  d.querySelector('#mode-pill').click();
  await sleep(100);
  A('the pill opens the mode chips, even with a title', d.querySelector('.band').classList.contains('mode-open') &&
    Wm.getComputedStyle(d.querySelector('.mode-chips')).display === 'flex');
  d.querySelector('.mode-chips [data-mode="o"]').click();
  await sleep(100);
  A('a picked mode shows on the pill and folds the chips', pill().includes('Other') && !d.querySelector('.band').classList.contains('mode-open'));
  const otherCut = await sendFive('Friday movie', ['Bowling', 'Board games', 'Stay in', 'Karaoke', 'Long walk']);
  A('once picked, the title no longer steers the mode', (await Wm.decodePayload(otherCut.split('#')[1])).m === 'o');
  Wm.location.href = otherCut;
  await sleep(400);
  d = f.contentDocument;
  A('other has no ↗ buttons', !d.querySelector('.choices .mapbtn, .choices .imdbbtn, .choices .facts'));
  A('food, travel and other rounds ask no outside service', calls.length === 0);

  // Watch: a word in the title that names a thing beats the genre, and costs the link nothing
  await freshCompose();
  type('#title-in', 'Next show');
  ['The Bear', 'The Crazy Chicken', 'Squid Game', 'Fight Club', 'Inception'].forEach((o, i) => { type('#opt' + i, o); leave('#opt' + i); });
  await sleep(600);
  A('the lookup still found The Bear (a comedy, 😂)', facts(0).includes('★ 8.5') && facts(0).includes('4 seasons'));
  A('a word in the title beats the genre: 🐻, not 😂', tile(0) === '🐻');
  A('a word needs no lookup: 🐔 🦑 🥊 (no sandwich)', tile(1) === '🐔' && tile(2) === '🦑' && tile(3) === '🥊');
  A('no word in the title, so the genre stays: 🚀', tile(4) === '🚀');
  d.querySelector('[data-action="compose-share"]').click();
  await sleep(400);
  const wordCut = d.querySelector('#compose-linkrow #share-url')?.dataset.url || '';
  const wwp = await Wm.decodePayload(wordCut.split('#')[1]);
  A('a word emoji costs the link nothing', wwp.o[0] === 'The Bear' && wwp.o[1] === 'The Crazy Chicken' && wwp.o[4] === '🚀 Inception');
  Wm.location.href = wordCut;
  await sleep(400);
  d = f.contentDocument;
  A('the other phone reads the same words', [...d.querySelectorAll('.choices .emoji')].map((e) => e.textContent).join('') === '🐻🐔🦑🥊🚀');
  const wf = (t) => Wm.emojiFor(t, 0, 'w');
  A('the most specific word wins', wf('The Lion King') === '🦁' && wf('House of Cards') === '🃏' && wf('King Kong') === '🦍' &&
    wf('The Queen’s Gambit') === '♟️' && wf('Ice Cream Man') === '🍦' && wf('Murder on the Orient Express') === '🚆');
  A('only whole words count', wf('Homeland') === '🎬' && wf('Anatomy of a Fall') === '🎬');

  // a mode picked on the pill survives a reload, with the rest of the draft
  await freshCompose();
  type('#opt0', 'Somewhere');
  d.querySelector('#mode-pill').click(); await sleep(100);
  d.querySelector('.mode-chips [data-mode="t"]').click(); await sleep(100);
  const reloadedMode = new Promise((r) => { f.onload = r; });
  Wm.location.reload();
  await reloadedMode;
  await sleep(300);
  d = f.contentDocument; Wm = f.contentWindow;
  A('a picked mode survives a reload', pill().includes('Travel') && d.querySelector('#opt0')?.value === 'Somewhere');
  A('…and so do its placeholders', d.querySelector('#opt1').placeholder === 'a city we haven’t done');

  finish();
}
function finish() {
  document.getElementById('out').textContent = log.join('\n');
  document.title = 'SMOKE:' + (log.filter((l) => l.startsWith('FAIL')).length === 0 ? 'PASS' : 'FAIL');
}
run().catch((e) => { log.push('ERROR ' + (e.stack || e)); finish(); });
</script>
