<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plot &amp; Wash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style>
  /* Plot & Wash — single committed theme: a dark studio bench so the paper pops.
     Every color painted explicitly; holds on any host ground. */
  :root{
    --bench:#211e1a;
    --panel:#2b2722;
    --panel-2:#343029;
    --edge:#3e382f;
    --text:#e8dfcf;
    --muted:#9a9080;
    --accent:#7189e8;
    --accent-ink:#16213f;
    --paper:#f6f1e6;
    --ink:#211f1c;
    --radius:10px;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --serif:'Instrument Serif', Georgia, serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background:var(--bench);}
  body{
    margin:0; background:var(--bench); color:var(--text);
    font-family:var(--mono); font-size:13px; line-height:1.45;
    touch-action:manipulation;
    min-height:100dvh;
  }
  .app{max-width:520px; margin:0 auto; padding:10px 14px calc(28px + env(safe-area-inset-bottom));}

  header{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:6px 2px 10px;}
  .wordmark{font-family:var(--serif); font-style:italic; font-weight:400; font-size:27px; letter-spacing:.01em; margin:0; color:var(--text);}
  .wordmark .amp{color:var(--accent); font-style:italic;}
  .exports{display:flex; gap:8px;}

  .btn{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text); background:var(--panel); border:1px solid var(--edge); border-radius:8px;
    padding:8px 11px; cursor:pointer; user-select:none;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn[disabled]{opacity:.35; pointer-events:none;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .paper-wrap{
    position:relative; border-radius:4px; overflow:hidden;
    box-shadow:0 1px 0 rgba(255,250,235,.06) inset, 0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.4);
    background:var(--paper);
  }
  canvas#paper{display:block; width:100%; height:auto; touch-action:none; cursor:crosshair;}

  .hint{color:var(--muted); font-size:11.5px; padding:9px 2px 2px; min-height:1.4em;}

  .tabs{
    display:grid; grid-template-columns:1fr 1fr; gap:6px;
    background:var(--panel); border:1px solid var(--edge); border-radius:var(--radius);
    padding:5px; margin:12px 0 10px;
  }
  .tab{
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    background:none; border:0; border-radius:7px; color:var(--muted); padding:10px 6px; cursor:pointer;
  }
  .tab .step{color:var(--accent); margin-right:6px; font-weight:400;}
  .tab.active{background:var(--panel-2); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .tab.active .step{color:var(--accent);}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}

  section.panel{background:var(--panel); border:1px solid var(--edge); border-radius:var(--radius); padding:12px;}
  section.panel[hidden]{display:none;}

  .gen-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  .gen-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; font-family:var(--mono); font-size:11.5px; font-weight:500; letter-spacing:.04em;
    color:var(--muted); background:var(--panel-2); border:1px solid var(--edge); border-radius:999px;
    padding:7px 13px; cursor:pointer;
  }
  .chip.active{color:var(--accent-ink); background:var(--accent); border-color:var(--accent); font-weight:600;}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .params{display:flex; flex-direction:column; gap:2px; margin-top:10px;}
  .param{display:grid; grid-template-columns:86px 1fr 44px; align-items:center; gap:10px; padding:7px 0;}
  .param label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .param output{font-size:11.5px; color:var(--text); text-align:right; font-variant-numeric:tabular-nums;}

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:26px; background:none; margin:0; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:3px; border-radius:2px; background:var(--edge);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--text); border:none; margin-top:-8.5px; box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-track{height:3px; border-radius:2px; background:var(--edge);}
  input[type=range]::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:var(--text); border:none;}
  input[type=range]:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .row-actions .btn{flex:1;}

  .pigments{display:flex; flex-wrap:wrap; gap:9px; padding:2px 0 8px;}
  .pig{
    width:36px; height:36px; border-radius:50%; border:2px solid rgba(0,0,0,.25); cursor:pointer; padding:0;
    box-shadow:0 2px 5px rgba(0,0,0,.4), 0 -6px 10px rgba(255,255,255,.14) inset;
  }
  .pig.active{outline:2px solid var(--text); outline-offset:3px;}
  .pig:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .pig.eraser{
    background:var(--paper);
    background-image:linear-gradient(135deg, transparent 44%, #b8503f 44%, #b8503f 56%, transparent 56%);
  }

  footer{color:var(--muted); font-size:11px; padding:16px 2px 0; line-height:1.6;}
  footer em{font-family:var(--serif); font-size:13px; color:var(--text);}

  #toast{
    position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(8px);
    background:var(--panel-2); color:var(--text); border:1px solid var(--edge); border-radius:8px;
    font-family:var(--mono); font-size:12px; padding:9px 14px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; max-width:86vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    box-shadow:0 6px 20px rgba(0,0,0,.5); z-index:9;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    #toast{transition:none;}
  }
</style>

<div class="app">
  <header>
    <h1 class="wordmark">Plot <span class="amp">&amp;</span> Wash</h1>
    <div class="exports">
      <button class="btn" id="btn-svg" title="Vector lines for a real pen plotter">SVG</button>
      <button class="btn" id="btn-png">PNG</button>
    </div>
  </header>

  <div class="paper-wrap"><canvas id="paper" width="1150" height="1626" aria-label="Artwork: plotted ink lines with watercolor wash"></canvas></div>
  <div class="hint" id="hint"></div>

  <nav class="tabs" aria-label="Mode">
    <button class="tab active" id="tab-plot"><span class="step">1</span>Plot</button>
    <button class="tab" id="tab-wash"><span class="step">2</span>Wash</button>
  </nav>

  <section class="panel" id="panel-plot">
    <div class="gen-row" id="gen-row"></div>
    <div class="params" id="params"></div>
    <div class="row-actions">
      <button class="btn primary" id="btn-seed">↻ New seed</button>
    </div>
  </section>

  <section class="panel" id="panel-wash" hidden>
    <div class="pigments" id="pigments"></div>
    <div class="params">
      <div class="param">
        <label for="w-size">Brush</label>
        <input type="range" id="w-size" min="8" max="90" step="1" value="34">
        <output id="w-size-out">34</output>
      </div>
      <div class="param">
        <label for="w-water">Water</label>
        <input type="range" id="w-water" min="1" max="10" step="1" value="5">
        <output id="w-water-out">5</output>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn" id="btn-undo" disabled>Undo</button>
      <button class="btn" id="btn-clear" disabled>Clear wash</button>
    </div>
  </section>

  <footer>
    <em>Ink first, water second.</em><br>
    The lines are true vectors — SVG export drops straight into an AxiDraw / NextDraw / iDraw
    via Inkscape or vpype, plotted with a waterproof fineliner. Then the wash goes on top,
    here with a finger, on the desk with a brush.
  </footer>
</div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ================= paper ================= */
const W = 1150, H = 1626;            // 1 : √2, maps to A4 (210 × 297 mm)
const MARGIN = 84;
const DW = W - 2*MARGIN, DH = H - 2*MARGIN;
const ASP = DW / DH;                 // ≈ .71 — square-space generators use this
const PAPER = '#f6f1e6', INK = '#211f1c';

const display = document.getElementById('paper');
const dctx = display.getContext('2d');
const inkC   = mkCanvas(), inkCtx   = inkC.getContext('2d');
const paintC = mkCanvas(), pctx     = paintC.getContext('2d');
const grainC = mkCanvas(), grainCtx = grainC.getContext('2d');
function mkCanvas(){ const c=document.createElement('canvas'); c.width=W; c.height=H; return c; }

/* one-time paper grain */
(function grain(){
  const t=document.createElement('canvas'); t.width=t.height=192;
  const tc=t.getContext('2d'), im=tc.createImageData(192,192);
  let s=1234567;
  for(let i=0;i<im.data.length;i+=4){
    s=(s*1664525+1013904223)>>>0;
    const v=s/4294967296;
    im.data[i]=im.data[i+1]=40; im.data[i+2]=32;
    im.data[i+3]=v<0.5 ? 0 : (v-0.5)*22;   // sparse dark specks, α ≤ ~11
  }
  tc.putImageData(im,0,0);
  grainCtx.fillStyle=grainCtx.createPattern(t,'repeat');
  grainCtx.fillRect(0,0,W,H);
})();

/* ================= seeded random + noise ================= */
function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15), 1|a);
    t=(t+Math.imul(t^(t>>>7), 61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function makeNoise(rng){
  const p=new Uint8Array(512), b=[...Array(256).keys()];
  for(let i=255;i>0;i--){ const j=(rng()*(i+1))|0; [b[i],b[j]]=[b[j],b[i]]; }
  for(let i=0;i<512;i++) p[i]=b[i&255];
  const fade=t=>t*t*(3-2*t), lerp=(a,c,t)=>a+(c-a)*t;
  const grad=(h,x,y)=>{switch(h&7){case 0:return x+y;case 1:return x-y;case 2:return -x+y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y;}};
  return function(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    x-=Math.floor(x); y-=Math.floor(y);
    const u=fade(x), v=fade(y);
    const aa=p[p[X]+Y], ab=p[p[X]+Y+1], ba=p[p[X+1]+Y], bb=p[p[X+1]+Y+1];
    return lerp(lerp(grad(aa,x,y),grad(ba,x-1,y),u), lerp(grad(ab,x,y-1),grad(bb,x-1,y-1),u), v)*0.709;
  };
}

/* ================= generators =================
   Each returns an array of polylines in unit paper space (x,y ∈ 0..1 of the
   drawable rect). sq() maps square space [-1,1]² to round-true paper coords. */
const sq=(fx,fy)=>[0.5+fx*0.5, 0.5+fy*0.5*ASP];

const GENS={
  field:{
    name:'Field',
    params:[
      {k:'lines', label:'Lines', min:40, max:320, step:10, v:170},
      {k:'zoom',  label:'Zoom',  min:1,  max:8,   step:0.5, v:3},
      {k:'len',   label:'Length',min:20, max:160, step:5,  v:85},
      {k:'swirl', label:'Swirl', min:0.4,max:3,   step:0.1,v:1.2},
    ],
    make(p,rng,noise){
      const out=[];
      for(let i=0;i<p.lines;i++){
        let x=rng(), y=rng();
        const pts=[];
        for(let s=0;s<p.len;s++){
          pts.push([x,y]);
          const a=noise(x*p.zoom, y*p.zoom*1.414)*Math.PI*2*p.swirl;
          x+=Math.cos(a)*0.006; y+=Math.sin(a)*0.006*ASP;
          if(x<0.002||x>0.998||y<0.002||y>0.998) break;
        }
        if(pts.length>4) out.push(pts);
      }
      return out;
    }
  },
  pendulum:{
    name:'Pendulum',
    params:[
      {k:'toneA', label:'Tone A', min:1, max:7,  step:1, v:3},
      {k:'toneB', label:'Tone B', min:1, max:7,  step:1, v:2},
      {k:'detune',label:'Detune', min:0, max:20, step:1, v:8},
      {k:'fade',  label:'Fade',   min:1, max:15, step:1, v:4},
      {k:'phase', label:'Phase',  min:0, max:180,step:5, v:90},
    ],
    make(p,rng){
      const d=0.0015*p.fade, ph=p.phase*Math.PI/180;
      const fa=p.toneA, fb=p.toneB, eps=p.detune*0.004;
      const p2=rng()*Math.PI*2, p3=rng()*Math.PI*2;
      const T=Math.min(420, 6/Math.max(d,0.002)), N=9000, pts=[];
      for(let i=0;i<=N;i++){
        const t=i/N*T, e=Math.exp(-d*t), e2=Math.exp(-d*0.55*t);
        const fx=0.92*(Math.sin(fa*t+ph)*e   + 0.32*Math.sin((fa+eps)*t+p2)*e2)/1.32;
        const fy=0.92*(Math.sin(fb*t)*e      + 0.32*Math.cos((fb+eps)*t+p3)*e2)/1.32;
        pts.push(sq(fx,fy));
      }
      return [pts];
    }
  },
  ridges:{
    name:'Ridges',
    params:[
      {k:'rows',  label:'Rows',  min:18, max:80, step:2, v:44},
      {k:'peaks', label:'Peaks', min:5,  max:45, step:1, v:22},
      {k:'grit',  label:'Grit',  min:2,  max:14, step:0.5, v:6},
      {k:'spread',label:'Spread',min:8,  max:45, step:1, v:22},
    ],
    make(p,rng,noise){
      const rows=p.rows|0, S=170, amp=p.peaks/100, focus=p.spread/100;
      const off=rng()*40;
      const rowPts=[];
      for(let r=0;r<rows;r++){
        const yb=0.06+0.88*r/(rows-1), pts=[];
        for(let i=0;i<=S;i++){
          const x=i/S;
          const env=Math.exp(-((x-0.5)**2)/(2*focus*focus)) * Math.exp(-((r/(rows-1)-0.55)**2)/0.16);
          const n=Math.max(0, noise(x*p.grit+off, r*0.37)*0.5+0.5-0.32);
          pts.push([x, yb - amp*env*Math.pow(n,1.4)*2.2]);
        }
        rowPts.push(pts);
      }
      /* hidden-line removal, front (bottom) rows occlude back rows */
      const horizon=new Float64Array(S+1).fill(Infinity), out=[];
      for(let r=rows-1;r>=0;r--){
        let cur=null;
        for(let i=0;i<=S;i++){
          const pt=rowPts[r][i];
          if(pt[1]<horizon[i]-0.0015){
            if(!cur){cur=[]; out.push(cur);} cur.push(pt); horizon[i]=pt[1];
          } else cur=null;
        }
      }
      return out;
    }
  },
  rotor:{
    name:'Rotor',
    params:[
      {k:'rings', label:'Rings', min:12, max:140, step:2, v:60},
      {k:'twist', label:'Twist', min:0,  max:6,   step:0.1, v:1.8},
      {k:'shrink',label:'Shrink',min:90, max:100, step:0.2, v:97.4},
      {k:'wobble',label:'Wobble',min:0,  max:60,  step:2, v:22},
      {k:'drift', label:'Drift', min:0,  max:100, step:5, v:35},
    ],
    make(p,rng,noise){
      const M=p.rings|0, K=170, out=[];
      const shrink=p.shrink/100, wob=p.wobble/100, drift=p.drift/100;
      const s0=rng()*7;
      for(let m=0;m<M;m++){
        const t=M>1 ? m/(M-1) : 0;
        const rot=p.twist*Math.PI/180*m;
        const scale=0.86*Math.pow(shrink,m);
        const cx=drift*0.5*Math.sin(t*Math.PI*2+s0);
        const cy=drift*0.5*Math.cos(t*Math.PI*1.7+s0*1.3);
        const pts=[];
        for(let i=0;i<=K;i++){
          const th=i/K*Math.PI*2;
          const r=scale*(1+wob*noise(Math.cos(th)*1.2+s0, Math.sin(th)*1.2+m*0.06));
          pts.push(sq(cx+r*Math.cos(th+rot), cy+r*Math.sin(th+rot)));
        }
        out.push(pts);
      }
      return out;
    }
  },
};

/* ================= state ================= */
const DEFAULTS=()=>{
  const params={}, seeds={};
  for(const g in GENS){
    params[g]={};
    for(const pr of GENS[g].params) params[g][pr.k]=pr.v;
    seeds[g]=(Math.random()*1e9)>>>0;
  }
  return {gen:'field', params, seeds};
};
let state=DEFAULTS();
try{
  const raw=localStorage.getItem('plotwash1');
  if(raw){
    const s=JSON.parse(raw);
    if(s && GENS[s.gen]){
      for(const g in GENS){
        if(s.params?.[g]) for(const pr of GENS[g].params){
          const v=s.params[g][pr.k];
          if(typeof v==='number' && v>=pr.min && v<=pr.max) state.params[g][pr.k]=v;
        }
        if(typeof s.seeds?.[g]==='number') state.seeds[g]=s.seeds[g];
      }
      state.gen=s.gen;
    }
  }
}catch(e){}
function persist(){ try{ localStorage.setItem('plotwash1', JSON.stringify(state)); }catch(e){} }

/* ================= ink rendering ================= */
let polylines=[];       // pixel-space
let segs=[];            // flattened segments for the plot animation
let animId=0, animToken=0;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

function toPixels(lines){
  return lines.map(pl=>pl.map(([x,y])=>[MARGIN+x*DW, MARGIN+y*DH]));
}
function generate(animate){
  const g=GENS[state.gen], p=state.params[state.gen];
  const rng=mulberry32(state.seeds[state.gen]);
  const noise=makeNoise(mulberry32(state.seeds[state.gen]^0x9e3779b9));
  polylines=toPixels(g.make(p,rng,noise));
  segs=[];
  for(const pl of polylines)
    for(let i=1;i<pl.length;i++) segs.push([pl[i-1][0],pl[i-1][1],pl[i][0],pl[i][1]]);
  renderInk(animate && !reduceMotion);
  persist();
}
function inkStyle(){
  inkCtx.strokeStyle=INK; inkCtx.lineWidth=2.1;
  inkCtx.lineJoin='round'; inkCtx.lineCap='round';
}
function drawSegs(from,to){
  inkCtx.beginPath();
  for(let i=from;i<to;i++){
    const s=segs[i];
    inkCtx.moveTo(s[0],s[1]); inkCtx.lineTo(s[2],s[3]);
  }
  inkCtx.stroke();
}
function renderInk(animate){
  cancelAnimationFrame(animId);
  const token=++animToken;
  inkCtx.clearRect(0,0,W,H);
  inkStyle();
  if(!animate){ drawSegs(0,segs.length); composite(); return; }
  const t0=performance.now(), dur=620, total=segs.length;
  let drawn=0;
  const frame=now=>{
    if(token!==animToken) return;
    const t=Math.min(1,(now-t0)/dur);
    const upTo=Math.floor(total*(1-Math.pow(1-t,3)));
    if(upTo>drawn){ drawSegs(drawn,upTo); drawn=upTo; }
    composite();
    if(t<1) animId=requestAnimationFrame(frame);
  };
  animId=requestAnimationFrame(frame);
}
function composite(){
  dctx.globalCompositeOperation='source-over';
  dctx.fillStyle=PAPER; dctx.fillRect(0,0,W,H);
  dctx.drawImage(grainC,0,0);
  dctx.drawImage(inkC,0,0);
  dctx.globalCompositeOperation='multiply';
  dctx.drawImage(paintC,0,0);
  dctx.globalCompositeOperation='source-over';
}

/* ================= plot panel UI ================= */
const genRow=document.getElementById('gen-row');
const paramsEl=document.getElementById('params');
for(const key in GENS){
  const b=document.createElement('button');
  b.className='chip'; b.textContent=GENS[key].name; b.dataset.gen=key;
  b.addEventListener('click',()=>{ state.gen=key; syncGenChips(); buildParams(); generate(true); });
  genRow.appendChild(b);
}
function syncGenChips(){
  for(const b of genRow.children) b.classList.toggle('active', b.dataset.gen===state.gen);
}
function fmt(v,step){ return step<1 ? v.toFixed(1) : String(Math.round(v)); }
function buildParams(){
  paramsEl.textContent='';
  const g=GENS[state.gen];
  for(const pr of g.params){
    const row=document.createElement('div'); row.className='param';
    const lab=document.createElement('label'); lab.textContent=pr.label; lab.htmlFor='p-'+pr.k;
    const inp=document.createElement('input');
    inp.type='range'; inp.id='p-'+pr.k; inp.min=pr.min; inp.max=pr.max; inp.step=pr.step;
    inp.value=state.params[state.gen][pr.k];
    const out=document.createElement('output'); out.textContent=fmt(+inp.value,pr.step);
    inp.addEventListener('input',()=>{
      state.params[state.gen][pr.k]=+inp.value;
      out.textContent=fmt(+inp.value,pr.step);
      generate(false);
    });
    row.append(lab,inp,out); paramsEl.appendChild(row);
  }
}
document.getElementById('btn-seed').addEventListener('click',()=>{
  state.seeds[state.gen]=(Math.random()*1e9)>>>0;
  generate(true);
});

/* ================= wash (watercolor) ================= */
const PIGMENTS=[
  ['Ultramarine', '#30549f'], ['Cerulean', '#3f8fb0'], ['Viridian', '#2e7d62'],
  ['Sap green',   '#7a9440'], ['Ochre',    '#c3922e'], ['Sienna',   '#a8552f'],
  ['Rose',        '#bf4d72'], ['Violet',   '#6d4d92'], ["Payne's grey", '#4c586e'],
];
let pigment=PIGMENTS[0][1], erasing=false;
const pigEl=document.getElementById('pigments');
for(const [name,hex] of PIGMENTS){
  const b=document.createElement('button');
  b.className='pig'; b.style.background=hex; b.title=name; b.setAttribute('aria-label',name);
  b.addEventListener('click',()=>{ pigment=hex; erasing=false; syncPigs(b); });
  pigEl.appendChild(b);
}
const eraserBtn=document.createElement('button');
eraserBtn.className='pig eraser'; eraserBtn.title='Lift paint'; eraserBtn.setAttribute('aria-label','Lift paint (eraser)');
eraserBtn.addEventListener('click',()=>{ erasing=true; syncPigs(eraserBtn); });
pigEl.appendChild(eraserBtn);
function syncPigs(active){ for(const b of pigEl.children) b.classList.toggle('active', b===active); }
syncPigs(pigEl.children[0]);

const sizeInp=document.getElementById('w-size'), waterInp=document.getElementById('w-water');
sizeInp.addEventListener('input',()=>document.getElementById('w-size-out').textContent=sizeInp.value);
waterInp.addEventListener('input',()=>document.getElementById('w-water-out').textContent=waterInp.value);

function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
let stampJitter=mulberry32(42);
function stamp(x,y,r,alpha){
  const jx=x+(stampJitter()-0.5)*r*0.18, jy=y+(stampJitter()-0.5)*r*0.18;
  const jr=r*(0.9+stampJitter()*0.2);
  if(erasing){
    pctx.globalCompositeOperation='destination-out';
    const g=pctx.createRadialGradient(jx,jy,0,jx,jy,jr);
    g.addColorStop(0,'rgba(0,0,0,0.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
    pctx.fillStyle=g;
  }else{
    pctx.globalCompositeOperation='source-over';
    const [cr,cg,cb]=hexRGB(pigment);
    const g=pctx.createRadialGradient(jx,jy,jr*0.12,jx,jy,jr);
    g.addColorStop(0,`rgba(${cr},${cg},${cb},${alpha*0.72})`);
    g.addColorStop(0.78,`rgba(${cr},${cg},${cb},${alpha})`);   /* wet edge */
    g.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    pctx.fillStyle=g;
  }
  pctx.beginPath(); pctx.arc(jx,jy,jr,0,7); pctx.fill();
}

/* undo — snapshots of the paint layer */
const undoStack=[];
let painted=false;
function pushUndo(){
  const c=mkCanvas(); c.getContext('2d').drawImage(paintC,0,0);
  undoStack.push(c); if(undoStack.length>8) undoStack.shift();
  syncWashButtons();
}
function syncWashButtons(){
  document.getElementById('btn-undo').disabled=undoStack.length===0;
  document.getElementById('btn-clear').disabled=!painted && undoStack.length===0;
}
document.getElementById('btn-undo').addEventListener('click',()=>{
  const c=undoStack.pop(); if(!c) return;
  pctx.globalCompositeOperation='source-over';
  pctx.clearRect(0,0,W,H); pctx.drawImage(c,0,0);
  composite(); syncWashButtons();
});
document.getElementById('btn-clear').addEventListener('click',()=>{
  pushUndo();
  pctx.globalCompositeOperation='source-over';
  pctx.clearRect(0,0,W,H);
  painted=false; composite(); syncWashButtons();
});

/* pointer painting */
let mode='plot';
let stroking=false, lastX=0, lastY=0, compositeQueued=false;
function canvasXY(e){
  const r=display.getBoundingClientRect();
  return [(e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H];
}
function queueComposite(){
  if(compositeQueued) return;
  compositeQueued=true;
  requestAnimationFrame(()=>{ compositeQueued=false; composite(); });
}
function paintTo(x,y,first){
  const r=+sizeInp.value*2.1;
  const alpha=0.016*+waterInp.value;
  if(first){ stamp(x,y,r,alpha); lastX=x; lastY=y; queueComposite(); return; }
  const dx=x-lastX, dy=y-lastY, dist=Math.hypot(dx,dy), gap=r*0.32;
  if(dist<gap) return;
  const n=Math.floor(dist/gap);
  for(let i=1;i<=n;i++) stamp(lastX+dx*i/n, lastY+dy*i/n, r, alpha);
  lastX+=dx*(Math.floor(dist/gap)*gap)/dist; lastY+=dy*(Math.floor(dist/gap)*gap)/dist;
  queueComposite();
}
display.addEventListener('pointerdown',e=>{
  if(mode!=='wash') return;
  e.preventDefault();
  display.setPointerCapture(e.pointerId);
  stroking=true; painted=true;
  pushUndo();
  const [x,y]=canvasXY(e);
  paintTo(x,y,true);
});
display.addEventListener('pointermove',e=>{
  if(!stroking) return;
  e.preventDefault();
  const evs=e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of evs){ const [x,y]=canvasXY(ev); paintTo(x,y,false); }
});
const endStroke=e=>{ if(stroking){ stroking=false; composite(); } };
display.addEventListener('pointerup',endStroke);
display.addEventListener('pointercancel',endStroke);

/* ================= tabs ================= */
const hints={
  plot:'Tune the machine. Every slider redraws the plot; ↻ throws new dice.',
  wash:'Paint with a finger — the ink underneath is waterproof.',
};
function setMode(m){
  mode=m;
  document.getElementById('tab-plot').classList.toggle('active', m==='plot');
  document.getElementById('tab-wash').classList.toggle('active', m==='wash');
  document.getElementById('panel-plot').hidden=m!=='plot';
  document.getElementById('panel-wash').hidden=m!=='wash';
  document.getElementById('hint').textContent=hints[m];
  display.style.cursor=m==='wash' ? 'pointer' : 'crosshair';
}
document.getElementById('tab-plot').addEventListener('click',()=>setMode('plot'));
document.getElementById('tab-wash').addEventListener('click',()=>setMode('wash'));

/* ================= export ================= */
const toastEl=document.getElementById('toast');
let toastT=0;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),2600);
}
let dlNS=null, dlTried=false;
async function getDownloads(){
  if(dlTried) return dlNS;
  dlTried=true;
  try{ if(window.claude && claude.use) dlNS=await claude.use('downloads'); }catch(e){}
  return dlNS;
}
async function saveFile(filename,data){
  const dl=await getDownloads();
  if(dl){
    try{ await dl.save({filename,data}); toast('Saved · '+filename); return; }
    catch(err){
      const code=err && err.code;
      if(code==='declined'){ toast('Save cancelled'); return; }
      if(code==='rate_limited'){ toast('One save at a time — try again'); return; }
      /* anything else: fall through to the plain download */
    }
  }
  try{
    const blob=data instanceof Blob ? data : new Blob([data]);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Saved · '+filename);
  }catch(e){ toast('Could not save from this view'); }
}
function buildSVG(){
  const s=210/W;  /* px → mm on A4 */
  let d='';
  for(const pl of polylines){
    d+='M'+(pl[0][0]*s).toFixed(2)+' '+(pl[0][1]*s).toFixed(2);
    for(let i=1;i<pl.length;i++) d+='L'+(pl[i][0]*s).toFixed(2)+' '+(pl[i][1]*s).toFixed(2);
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">'
    +'<path fill="none" stroke="#000" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round" d="'+d+'"/></svg>';
}
document.getElementById('btn-svg').addEventListener('click',()=>{
  saveFile('plotwash-'+state.gen+'-'+state.seeds[state.gen]+'.svg', buildSVG());
});
document.getElementById('btn-png').addEventListener('click',()=>{
  renderInk(false);   /* make sure the plot animation isn't mid-draw */
  display.toBlob(b=>{
    if(!b){ toast('Could not render PNG'); return; }
    saveFile('plotwash-'+state.gen+'-'+state.seeds[state.gen]+'.png', b);
  },'image/png');
});

/* ================= boot ================= */
syncGenChips(); buildParams(); setMode('plot'); syncWashButtons();
generate(!reduceMotion);

/* ================= smoke hook (harmless in normal use) ================= */
if(location.hash==='#smoke'){
  setTimeout(()=>{
    const out=[];
    const check=(name,ok)=>out.push((ok?'PASS':'FAIL')+' '+name);
    try{
      for(const g in GENS){
        state.gen=g; generate(false);
        check('gen '+g+' lines='+polylines.length, polylines.length>0 && segs.length>10);
      }
      const im=inkCtx.getImageData(0,0,W,H).data;
      let inked=0; for(let i=3;i<im.length;i+=997*4) if(im[i]>0) inked++;
      check('ink pixels '+inked, inked>3);
      const svg=buildSVG();
      check('svg bytes '+svg.length, svg.length>2000);
      setMode('wash');
      painted=true; pushUndo();
      for(let i=0;i<=30;i++) stamp(200+i*20, 400+Math.sin(i/3)*60, 70, 0.09);
      composite();
      const pd=pctx.getImageData(0,0,W,H).data;
      let wet=0; for(let i=3;i<pd.length;i+=997*4) if(pd[i]>0) wet++;
      check('paint pixels '+wet, wet>2);
      document.getElementById('btn-undo').click();
      const pd2=pctx.getImageData(0,0,W,H).data;
      let wet2=0; for(let i=3;i<pd2.length;i+=997*4) if(pd2[i]>0) wet2++;
      check('undo cleared '+wet2, wet2===0);
    }catch(err){ out.push('ERROR '+err.message); }
    const pre=document.createElement('pre'); pre.id='out'; pre.textContent=out.join('\n');
    document.body.appendChild(pre);
  }, 300);
}
</script>
