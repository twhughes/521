/* ---------- share: one tap ----------
   Every screen has two ways out and one message: Send opens Messages with it
   prefilled, Copy puts it on the clipboard. Safari honors either hand-off only
   when it starts inside the tap itself — it revokes clipboard permission, and
   balks at opening Messages, once the click task has awaited — yet links encode
   asynchronously (CompressionStream). So each screen keeps its outgoing message
   prebuilt (prepare(), rerun after every edit) and the tap hands it over
   synchronously; copyText also takes a PROMISE for a tap that beats prepare(),
   handing it to the clipboard via ClipboardItem (the WebKit-blessed way to copy
   content still being computed), with writeText + execCommand as fallbacks. */
async function copyText(textOrPromise) {
  const text = () => Promise.resolve(textOrPromise).then(String);
  try {
    if (navigator.clipboard?.write && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/plain': text().then((t) => new Blob([t], { type: 'text/plain' })),
      })]);
      return true;
    }
  } catch {}
  try { await navigator.clipboard.writeText(await text()); return true; } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = await text();
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

/* ---------- Watch: the IMDb score + length ----------
   IMDb has no free official API: its own search sends no CORS header, and OMDb/TMDB need keys a
   public page can't keep. Cinemeta, Stremio's free public movie database, is keyless, allows
   browser calls, and reports IMDb's score, the runtime, the genres and the seasons. Only the
   LISTER's phone asks, only in Watch mode, and only once a title stops changing (a pause, or
   leaving the row) — half-typed words never go out. The facts then ride in the link (`x`), so
   the other phone asks no one. Each title is asked once, then remembered on this phone. */
const CINEMETA = 'https://v3-cinemeta.strem.io';
const LOOKUP_PAUSE = 1000; // ms without typing before a title counts as finished
const watch = { cache: store.get('watchCache', {}), pending: new Map(), timers: {}, hint: '' };
const bareName = (s) => normName(String(s || '').replace(/^\s*(the|a|an)\s+/i, ''));
const watchKey = (text, hint) => hint + '|' + normName(splitEmoji(text).rest);
const clampInt = (n, hi) => Math.max(0, Math.min(hi, Math.round(Number(n) || 0)));
function cachedFacts(text, hint) { // undefined: not asked yet · 0: no match · {…}: the facts
  const hit = watch.cache[watchKey(text, hint)];
  return hit && Date.now() - hit.ts < 14 * 864e5 ? hit.f : undefined;
}
function saveWatchCache() { // this phone only, the newest 80 titles
  const keys = Object.keys(watch.cache).sort((a, b) => watch.cache[b].ts - watch.cache[a].ts);
  for (const k of keys.slice(80)) delete watch.cache[k];
  store.set('watchCache', watch.cache);
}
function parseRuntime(s) { // "148 min", "2h 28min", "1h"
  const t = String(s || '');
  const h = t.match(/(\d+)\s*h/i), m = t.match(/(\d+)\s*m/i);
  return h ? Number(h[1]) * 60 + (m ? Number(m[1]) : 0) : m ? Number(m[1]) : 0;

async function cinemeta(path) {

  if (!r.ok) throw new Error('cinemeta ' + r.status);

}
/* both shelves at once. An exact name beats a prefix ("Shawshank" still finds The Shawshank
   Redemption), a year you typed must agree, the title's hint breaks a film/show tie, then
   popularity does (Fargo the show over Fargo the film). Throws only when Cinemeta can't be
   reached, so an offline miss is asked again later instead of remembered as "no match". */
async function lookupTitle(text, hint) {
  const raw = splitEmoji(text).rest.trim().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const year = (raw.match(/\b(19|20)\d{2}\b/) || [''])[0];
  const want = bareName(year ? raw.replace(year, '') : raw);
  if (want.length < 2) return 0;
  const shelves = await Promise.allSettled(['movie', 'series'].map((kind) =>
    cinemeta(`/catalog/${kind}/top/search=${encodeURIComponent(raw)}.json`)
      .then((j) => (j.metas || []).slice(0, 4).map((m) => ({ m, kind })))));
  if (shelves.every((s) => s.status === 'rejected')) throw new Error('cinemeta unreachable');
  const scored = shelves.flatMap((s) => s.value || []).map((c) => {
    if (!/^tt\d{1,10}$/.test(c.m.imdb_id || c.m.id || '')) return null; // its id goes into the next request
    const n = bareName(c.m.name);
    let score = n === want ? 3 : n.startsWith(want) ? 2 : 0;
    if (!score) return null;
    if (year) score += String(c.m.releaseInfo || c.m.year || '').startsWith(year) ? 2 : -5;
    if (hint && c.kind === hint) score += 1;
    return score > 0 ? { ...c, score } : null;
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  if (!scored.length) return 0;
  const top = ['movie', 'series'].map((k) => scored.find((c) => c.kind === k))
    .filter((c) => c && c.score === scored[0].score);
  const metas = await Promise.allSettled(top.map((c) =>
    cinemeta(`/meta/${c.kind}/${c.m.imdb_id || c.m.id}.json`).then((j) => j.meta && { ...j.meta, kind: c.kind })));
  if (metas.every((s) => s.status === 'rejected')) throw new Error('cinemeta unreachable');
  const best = metas.map((s) => s.value).filter(Boolean).sort((a, b) => (b.popularity || 0) - (a.popularity || 0))[0];
  return best ? factsFromMeta(best) : 0;
}
function factsFromMeta(m) {

  const series = m.kind === 'series';
  return {
    id, series,
    score: clampInt((parseFloat(m.imdbRating) || 0) * 10, 100),
    minutes: clampInt(parseRuntime(m.runtime), 5000),
    seasons: series ? clampInt(new Set((m.videos || []).map((v) => v.season).filter((s) => Number.isInteger(s) && s > 0)).size, 500) : 0,
    genre: genreEmoji(m.genre || m.genres, series),

const packFacts = (f) => f.series ? [f.id, f.score, f.minutes, f.seasons] : [f.id, f.score, f.minutes];
/* the receiving side trusts nothing it decodes: numbers only, in range, or no facts at all */
function factsAt(p, i) {

  if (!Array.isArray(f) || f.length < 3 || f.length > 4 || !f.every((n) => Number.isInteger(n) && n >= 0)) return null;
  const [id, score, minutes, seasons = 0] = f;
  if (!id || id > 1e9 || score > 100 || minutes > 5000 || seasons > 500) return null;
  return { id, score, minutes, seasons, series: f.length === 4 };
}
const imdbTitleUrl = (id) => 'https://www.imdb.com/title/tt' + String(id).padStart(7, '0') + '/';
const imdbFindUrl = (name) => 'https://www.imdb.com/find/?q=' + encodeURIComponent(name);
const fmtScore = (f) => f.score ? '★ ' + (f.score / 10).toFixed(1) : '';
function fmtLength(f) {

  if (!f.minutes) return '';

async function runLookup(i) {

/* ---------- confetti ---------- */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = $('#confetti');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const colors = ['#2446F0', '#FFC21F', '#D63B1F', '#8FA2FF', '#FFE08A', '#FF9A85']; // the three step colors + tints
  const parts = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.5,
    y: innerHeight * 0.35 + (Math.random() - 0.5) * 60,
    vx: (Math.random() - 0.5) * 11,
    vy: -(4 + Math.random() * 10),
    w: 6 + Math.random() * 6,
    h: 8 + Math.random() * 8,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.3,
    color: colors[(Math.random() * colors.length) | 0],
  }));
  const t0 = performance.now();
  (function frame(t) {
    const dt = (t - t0) / 1000;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, 1 - dt / 2.4);
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (dt < 2.5) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

function updateModeUI() {

function setMode(mode, touched) {

  const into = mode !== roundMode && mode === 'w';
  if (mode !== roundMode) closePalette(); // its default grid belongs to the old mode
  roundMode = mode;

}
function toggleModeMenu(open) {

/* a new title can change the mode (unless you picked one) and, in Watch, which shelf to search */
function titleChanged(now) {

  }
}

/* ============================================================
   ACTIONS
   ============================================================ */
/* the compose form as a payload — or the reason it isn't one yet */
function readCompose() {
  const title = $('#title-in')?.value.trim() ?? '';
  const name = $('#name-in')?.value.trim() ?? '';
  const note = $('#note-in')?.value.trim() ?? '';
  const mode = roundMode;
  const hint = typeHint(title);
  const opts = [], facts = [];
  for (let i = 0; i < composeCount; i++) {
    const v = $('#opt' + i)?.value.trim() ?? '';
    let e = optEmoji[i] || (v ? autoEmoji(i, v) : null);
    if (v && e && emojiFor(v, opts.length, mode) === e) e = null; // receiver re-derives it — keep the link short
    if (v && e) opts.push(e + ' ' + v);
    else if (v || e) opts.push(v || e); // a lone emoji is a legitimate option
    else continue;
    const f = mode === 'w' && v ? cachedFacts(v, hint) : null;
    facts.push(f ? packFacts(f) : 0); // aligned with o: 0 = nothing found (yet)
  }
  if (opts.length < 3) return { error: 'Give them at least 3 options (5 is the ritual).' };
  const lower = opts.map((o) => o.toLowerCase());
  if (new Set(lower).size !== lower.length) return { error: 'Two of those are the same. Every option should be distinct.' };
  const payload = { v: 1, s: 'cut', t: title, l: name, o: opts };
  if (mode !== 'f') payload.m = mode;               // Food is the default: older links have no mode
  if (facts.some(Array.isArray)) payload.x = facts; // Watch only, once something was found
  if (note) payload.n = note; // keep the field out of the URL entirely when unused
  return { payload, title, name };
}

/* the one message this screen sends next, as { key, build } — null until the screen is
   ready (under 3 options, not 2 kept yet, no winner). key changes whenever the message would. */
function outgoing() {
  const view = app.dataset.view;
  const p = routedPayload;
  let payload = null, lead = '';
  if (view === 'compose') payload = readCompose().payload || null;
  else if (view === 'cut' && p && keepSet.size === 2) {
    payload = { ...p, s: 'close', c: $('#cutter-name')?.value.trim() ?? '', k: [...keepSet].sort((a, b) => a - b) };
    const kn = $('#cut-note')?.value.trim();
    if (kn) payload.kn = kn;
  } else if (view === 'close' && p && finalPick !== null) {
    payload = { ...p, s: 'done', w: finalPick };
    const wn = $('#close-note')?.value.trim();
    if (wn) payload.wn = wn;
    lead = `🏆 ${p.o[finalPick]}! `; // the verdict reads in the thread before anyone taps
  }
  if (!payload) return null;
  return {
    key: lead + JSON.stringify(payload),
    build: async () => { const url = await linkFor(payload); return { url, msg: lead + url }; },
  };
}

let prepared = { key: '', url: '', msg: '' };
let prepTimer = null;
function schedulePrepare() {
  clearTimeout(prepTimer);
  prepTimer = setTimeout(prepare, 120);
  // an edit makes the last copied link stale: take the "Copied ✓" and the old link row down
  const copy = $('#cta2');
  if (copy?.dataset.label && copy.textContent !== copy.dataset.label) copy.textContent = copy.dataset.label;
  const row = $(`#${app.dataset.view}-linkrow`);
  if (row) row.innerHTML = '';
}
async function prepare() {
  const spec = outgoing();
  if (!spec) { prepared = { key: '', url: '', msg: '' }; return prepared; }
  if (spec.key !== prepared.key) {
    const built = await spec.build();
    if (outgoing()?.key === spec.key) prepared = { key: spec.key, ...built };
  }
  return prepared;
}

/* both bottom buttons land here, synchronously inside the tap (see the share note above) */
function share(via) { // via: 'messages' | 'copy'
  const view = app.dataset.view;
  if (view === 'compose') {
    const { error } = readCompose();
    const err = $('#form-error');
    err.textContent = error || '';
    err.classList.toggle('show', !!error);
    if (error) return;
  }
  const spec = outgoing();
  if (!spec) return;
  const ready = prepared.key === spec.key ? prepared : null;
  const builtP = ready ? Promise.resolve(ready) : spec.build();
  if (via === 'messages') {
    const open = (msg) => { location.href = 'sms:&body=' + encodeURIComponent(msg); };
    if (ready) open(ready.msg);
    else builtP.then((b) => open(b.msg)); // only when the tap beat prepare(); Messages may ask first
  }
  const copiedP = via === 'copy' ? copyText(ready ? ready.msg : builtP.then((b) => b.msg)) : null;
  afterShare(view, builtP, copiedP);
}
async function afterShare(view, builtP, copiedP) {
  const { url } = await builtP;
  const p = routedPayload;
  if (view === 'compose') {
    const { title, name } = readCompose();
    if (name) store.set('name', name);
    rememberOpts((i) => $('#opt' + i)?.value); // local-only: learn these names + emoji for next time
    store.set('draft', null); // sent — the draft's job is done
    logRound({ title, stage: 'sent', url });
  } else if (view === 'cut') {
    const cutter = $('#cutter-name')?.value.trim();
    if (cutter) store.set('name', cutter);
    logRound({ title: p.t, stage: 'cut', url });
  } else if (view === 'close') {
    logRound({ title: p.t, stage: 'closed', winner: p.o[finalPick], url });
  }
  const row = $(`#${view}-linkrow`);
  if (row) row.innerHTML = linkRowHTML(url);
  if (!copiedP) return;
  const copy = $('#cta2');
  if (await copiedP) { toast('Link copied. Paste it anywhere.'); if (copy) copy.textContent = 'Copied ✓'; }
  else toast('Copy blocked. Tap the link below to copy.');
}

function markKept(row, on) {
  row.classList.toggle('kept', on);
  const main = row.querySelector('.choice');
  main.classList.toggle('kept', on);
  main.setAttribute('aria-pressed', String(on));
}
function toggleKeep(btn) {
  const i = Number(btn.dataset.i);
  const row = btn.closest('.choice-row');
  if (keepSet.has(i)) keepSet.delete(i);
  else if (keepSet.size < 2) {
    keepSet.add(i);
    if (struckSet.has(i)) { struckSet.delete(i); row.classList.remove('struck'); } // keeping un-crosses
  }
  else { toast('Only 2. Swap one out first.'); return; }
  markKept(row, keepSet.has(i));
  refreshKeepUI();
}
function toggleStrike(btn) {
  const i = Number(btn.dataset.i);
  const row = btn.closest('.choice-row');
  if (struckSet.has(i)) { struckSet.delete(i); row.classList.remove('struck'); return; }
  struckSet.add(i); row.classList.add('struck');
  if (keepSet.has(i)) { keepSet.delete(i); markKept(row, false); refreshKeepUI(); } // crossing out drops the keep
}
function refreshKeepUI() {
  const full = keepSet.size === 2;
  const counter = $('#keep-counter');
  if (counter) counter.innerHTML = full ? '<span class="full">2 of 2 kept ✓</span>' : `${keepSet.size} of 2 kept. Tap ✕ to rule one out.`;
  for (const id of ['#cta', '#cta2']) { const b = $(id); if (b) b.disabled = !full; }
  document.querySelectorAll('.choices .choice').forEach((c) => {
    c.closest('.choice-row').classList.toggle('dimmed-row', full && !keepSet.has(Number(c.dataset.i)));
  });
  Object.keys(geo.markers).forEach((k) => setPinVisible(+k, !full || keepSet.has(+k)));
  if (full && geo.map) {
    const pts = [...keepSet].map((k) => geo.markers[k]?.getLatLng()).filter(Boolean);
    if (pts.length === 2) geo.map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
  }
  schedulePrepare();
}

/* picking is a radio: tap the other one to change your mind, right up until you send */
function pickFinal(btn) {
  const first = finalPick === null;
  finalPick = Number(btn.dataset.i);
  document.querySelectorAll('#final-choices .choice-row').forEach((row) => {
    const main = row.querySelector('.choice');
    const on = Number(main.dataset.i) === finalPick;
    row.classList.toggle('picked', on);
    row.classList.toggle('dimmed-row', !on);
    main.classList.toggle('winner', on);
    main.setAttribute('aria-pressed', String(on));
  });
  Object.keys(geo.markers).forEach((k) => setPinVisible(+k, +k === finalPick));
  if (geo.markers[finalPick]) showMap(finalPick);
  for (const id of ['#cta', '#cta2']) { const b = $(id); if (b) b.disabled = false; }
  if (first) {
    confetti();
    $('#close-after').innerHTML = `
      <div class="card gap">
        ${noteCell('close-note', 'a last word? “it was close”')}
        <div class="cell plain meta-row">${addNoteBtn('close-note', '✎ Add a last word')}</div>
      </div>`;
  }
  schedulePrepare();
}

/* ---------- event delegation ---------- */
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  const act = el?.dataset.action;
  // gave up on the emoji? tapping anywhere else puts the palette away
  if (paletteFor !== null && act !== 'emoji-pick' && !e.target.closest('.emoji-palette')) closePalette();
  // …and the mode chips fold back the same way
  if (act !== 'mode-open' && act !== 'mode-set' && $('.band.mode-open')) toggleModeMenu(false);
  if (!el) return;
  if (act === 'chip-title') { $('#title-in').value = el.dataset.title; modeTouched = false; titleChanged(true); } // a chip's title sets its mode
  else if (act === 'mode-open') toggleModeMenu(!$('.band')?.classList.contains('mode-open'));
  else if (act === 'mode-set') { toggleModeMenu(false); setMode(el.dataset.mode, true); }
  else if (act === 'add-option') { composeCount = Math.min(6, composeCount + 1); saveDraft(); const vals = saveComposeValues(); renderHome(); restoreComposeValues(vals); saveDraft(); toast('The ritual is five. Desperation noted 😌'); }
  else if (act === 'send-msg') share('messages');
  else if (act === 'compose-share' || act === 'cut-share' || act === 'close-share') share('copy');
  else if (act === 'toggle-keep') toggleKeep(el);
  else if (act === 'toggle-strike') toggleStrike(el);
  else if (act === 'add-note') revealNote(el.dataset.for, true);
  else if (act === 'pick-final') pickFinal(el);
  else if (act === 'done-restart') { location.hash = ''; composeCount = 5; optEmoji = {}; route(); }
  else if (act === 'emoji-pick') { const i = Number(el.dataset.i); paletteFor === i ? closePalette() : openPalette(i); }
  else if (act === 'emoji-set') {
    const i = Number(el.dataset.i);
    emojiTouched.add(i);                     // your choice wins — stop auto-filling this row
    if (el.dataset.e) optEmoji[i] = el.dataset.e; else delete optEmoji[i];
    closePalette();
    updateEmojiBtn(i);
    saveDraft();
    schedulePrepare();
  }
  else if (act === 'show-map') showMap(Number(el.dataset.i));
  else if (act === 'copy-url') {
    copyText(el.dataset.url).then((ok) => toast(ok ? 'Link copied ✓' : 'Long-press the link to copy'));
  }
});
function saveDraft() {
  store.set('draft', { ...saveComposeValues(), emoji: { ...optEmoji }, count: composeCount, mode: roundMode, modeTouched });
}
function saveComposeValues() {
  return {
    title: $('#title-in')?.value, name: $('#name-in')?.value, note: $('#note-in')?.value,
    opts: Array.from({ length: composeCount }, (_, i) => $('#opt' + i)?.value ?? ''),
  };
}
function restoreComposeValues(v) {
  if (!v) return;
  if ($('#title-in')) $('#title-in').value = v.title ?? '';
  if ($('#name-in')) $('#name-in').value = v.name ?? '';
  if ($('#note-in')) $('#note-in').value = v.note ?? '';
  v.opts.forEach((val, i) => { if ($('#opt' + i)) $('#opt' + i).value = val; });
  watch.hint = typeHint(v.title);
  updateModeUI();
  fitTitle();
  if (v.note) revealNote('note-in');
  scheduleAllLookups(true);
  schedulePrepare();
}

/* ---------- compose emoji picker ---------- */
function emojiBtnFor(i) { return $('#opt' + i)?.closest('.opt-row')?.querySelector('.emoji-btn'); }
/* an emoji this phone fills in by itself, beyond the shared guesser: your own past pick for this
   name, or in Watch the genre of the title it found. Worked out from the text every time, never
   stored, so it follows the text — clear the row and it's gone, instead of lingering as a lone
   emoji option. A row whose palette you opened stops getting the memory; the genre is the app's
   own guess, so "auto" in the palette brings it back. */
function autoEmoji(i, v) {
  if (splitEmoji(v).e) return null;
  return (!emojiTouched.has(i) && rememberedEmoji(v))
    || (roundMode === 'w' && cachedFacts(v, typeHint($('#title-in')?.value))?.genre) || null;
}
function updateEmojiBtn(i) {
  const btn = emojiBtnFor(i);
  if (!btn) return;
  const v = $('#opt' + i).value.trim();
  const ex = optEmoji[i];
  btn.classList.toggle('set', !!ex);
  btn.classList.toggle('auto', !ex && !!v);
  btn.classList.toggle('empty', !ex && !v);
  btn.textContent = ex || (v ? autoEmoji(i, v) || emojiFor(v, i, roundMode) : '＋'); // no pick yet → live-preview the auto-guess
}
function closePalette() { $('#emoji-palette')?.remove(); paletteFor = null; }
function palCells(i, query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) {
    return `<button class="pal-cell pal-auto" data-action="emoji-set" data-i="${i}">auto</button>`
      + (MODES[roundMode].palette || EMOJI_PALETTE).map((e) => `<button class="pal-cell" data-action="emoji-set" data-i="${i}" data-e="${e}">${e}</button>`).join('');
  }
  const match = (kw) => q.includes(' ') ? kw.includes(q) : kw.split(' ').some((t) => t.startsWith(q));
  const hits = EMOJI_SEARCH.filter(([, kw]) => match(kw)).slice(0, 64);
  if (!hits.length) return `<div class="pal-empty">no match — try “pizza”, “park”, “wine”…</div>`;
  return hits.map(([e]) => `<button class="pal-cell" data-action="emoji-set" data-i="${i}" data-e="${e}">${e}</button>`).join('');
}
function openPalette(i) {
  closePalette();
  paletteFor = i;
  const pal = document.createElement('div');
  pal.className = 'emoji-palette';
  pal.id = 'emoji-palette';
  pal.innerHTML = `<input class="pal-search" id="pal-search" data-i="${i}" autocomplete="off"
      placeholder="search emoji — pizza, park, wine…" aria-label="search emoji">
    <div class="pal-grid" id="pal-grid">${palCells(i, '')}</div>`;
  emojiBtnFor(i).closest('.opt-row').after(pal);
  pal.querySelector('#pal-search').focus(); // start typing immediately
}
/* the title is the band's headline: a long one steps down a size instead of scrolling out of view */
function fitTitle() {
  const el = $('#title-in');
  if (!el) return;
  const n = (el.value || el.placeholder).length;
  el.style.fontSize = n > 24 ? '24px' : n > 17 ? '29px' : '';
}
function autosize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
/* as you type: the emoji button previews what the cut view will auto-guess, the draft saves,
   notes grow to fit, and the outgoing link rebuilds so Send still works in one tap */
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.tagName === 'TEXTAREA') autosize(t);
  if (t.id === 'pal-search') {
    const grid = $('#pal-grid');
    if (grid) grid.innerHTML = palCells(Number(t.dataset.i), t.value);
    return;
  }
  if (t.classList?.contains('opt-in')) {
    const i = Number(t.id.slice(3));
    updateEmojiBtn(i);
    updateFactsUI(i);
    scheduleLookup(i); // Watch: only once you pause — half-typed words never go out
    saveDraft();
  }
  else if (t.id === 'title-in') titleChanged(false);
  else if (['name-in', 'note-in'].includes(t.id)) saveDraft();
  schedulePrepare();
});
/* leaving a row means its title is finished: look it up now instead of after the pause */
app.addEventListener('change', (e) => {
  if (e.target.classList?.contains('opt-in')) scheduleLookup(Number(e.target.id.slice(3)), true);
});
/* enter → next field: title → option 1 → … → the last option */
app.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'title-in') { e.preventDefault(); $('#opt0')?.focus(); return; }
  if (!t.classList?.contains('opt-in')) return;
  e.preventDefault();
  const next = $('#opt' + (Number(t.id.slice(3)) + 1));
  if (next) next.focus();
  else t.blur();
});
/* paste a numbered list into any option field → fill the five */
app.addEventListener('paste', (e) => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('opt-in')) return;
  const text = e.clipboardData?.getData('text') ?? '';
  if (!text.includes('\n')) return;
  e.preventDefault();
  const raw = text.split('\n').map((s) => s.trim()).filter(Boolean);
  if (!raw.length) return;
  // strip leading "1", "2.", "3)" only when they're a real 1..n enumeration ("5 Guys" survives)
  const nums = raw.map((s) => { const m = s.match(/^(\d+)[\s.):\-]+/); return m ? Number(m[1]) : null; });
  const sequential = nums.length > 1 && nums.every((n, i) => n === i + 1);
  const lines = sequential ? raw.map((s) => s.replace(/^\d+[\s.):\-]+\s*/, '')) : raw;
  const start = Number(t.id.slice(3)) || 0;
  const needed = Math.min(6, start + lines.length);
  if (needed > composeCount) {
    const vals = saveComposeValues();
    composeCount = needed;
    saveDraft(); // renderHome rebuilds from the draft: keep the mode you're in
    renderHome();
    restoreComposeValues(vals);
  }
  lines.slice(0, 6 - start).forEach((l, j) => { const el = $('#opt' + (start + j)); if (el) el.value = l.slice(0, 64); });
  for (let i = 0; i < composeCount; i++) { updateEmojiBtn(i); updateFactsUI(i); }
  scheduleAllLookups(true); // a pasted list is finished titles
  saveDraft();
  schedulePrepare();
  toast('Filled from your list ✂️');
});

/* number keys toggle choices, Escape puts the emoji palette away (desktop niceties) */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && paletteFor !== null) { closePalette(); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const n = Number(e.key);
  if (n >= 1 && n <= 7) {
    const btn = document.querySelectorAll('.choices .choice')[n - 1];
    if (btn && !btn.disabled) btn.click();
  }
});

/* ---------- router ---------- */
let routedPayload = null;
async function route() {
  keepSet = new Set(); finalPick = null; resetGeo();
  prepared = { key: '', url: '', msg: '' };
  let p = null;
  const hash = location.hash.slice(1);
  if (hash) {
    try { p = await decodePayload(hash); } catch { renderBroken(); return; }
  }
  routedPayload = p;
  if (!p) { renderHome(); document.title = '5 · 2 · 1'; return; }
  if (p.s === 'draft' && Array.isArray(p.o)) {
    // deep-link prefill (e.g. dictated via VoiceInk): seed the compose draft and open compose —
    // the round only becomes real when the lister reviews and taps share, so the hash is stripped here
    store.set('draft', {
      title: p.t || '', name: store.get('name', ''), note: p.n || '',
      opts: p.o.slice(0, 6).map((o) => String(o ?? '')), emoji: {}, count: Math.min(6, Math.max(5, p.o.length)),
      mode: isMode(p.m) ? p.m : 'f', modeTouched: isMode(p.m), // a draft that names its mode keeps it
    });
    history.replaceState(null, '', location.pathname + location.search);
    routedPayload = null;
    renderHome(); document.title = '5 · 2 · 1';
    return;
  }
  if (p.s === 'cut' && Array.isArray(p.o) && p.o.length >= 2) { renderCut(p); document.title = `5·2·1 — ${p.t || 'your cut'}`; }
  else if (p.s === 'close' && Array.isArray(p.k) && p.k.length === 2) { renderClose(p); document.title = `5·2·1 — ${p.t ? p.t + ' · ' : ''}your pick`; }
  else if (p.s === 'done' && Number.isInteger(p.w) && p.o?.[p.w] !== undefined) { renderDone(p); document.title = `5·2·1 — 🏆 ${p.o[p.w]}`; }
  else renderBroken();
  scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
